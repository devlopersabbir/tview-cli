version: 2

project_name: tview

before:
  hooks:
    - go mod tidy

builds:
  - id: tview
    main: ./cmd/tview
    binary: tview
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tview
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - scripts/install.sh
      - scripts/install.ps1

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: linux-packages
    package_name: tview
    vendor: Sabbir Hossain Shuvo
    homepage: https://github.com/devlopersabbir/tview-cli
    maintainer: Sabbir Hossain Shuvo <devlopersabbir@users.noreply.github.com>
    description: Terminal candlestick chart viewer powered by Bybit market data.
    license: MIT
    section: utils
    priority: optional
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/tview/LICENSE
      - src: README.md
        dst: /usr/share/doc/tview/README.md

homebrew_casks:
  - name: tview
    ids:
      - tview
    repository:
      owner: devlopersabbir
      name: tview-cli
      token: "{{ .Env.PACKAGE_MANAGER_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/devlopersabbir/tview-cli
    description: Terminal candlestick chart viewer powered by Bybit market data.
    license: MIT
    binaries:
      - tview
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr",
                         args: ["-d", "com.apple.quarantine", "#{staged_path}/tview"],
                         sudo: false,
                         must_succeed: false
          system_command "/usr/bin/xattr",
                         args: ["-d", "com.apple.provenance", "#{staged_path}/tview"],
                         sudo: false,
                         must_succeed: false
    caveats: |
      tview was installed to:
        #{HOMEBREW_PREFIX}/bin/tview

      If your shell cannot find tview, make sure Homebrew's bin directory is in your PATH:
        eval "$(/opt/homebrew/bin/brew shellenv)"   # Apple Silicon
        eval "$(/usr/local/bin/brew shellenv)"      # Intel Mac

      The macOS binary is not Apple-notarized yet. If Gatekeeper blocks it, run:
        xattr -d com.apple.quarantine #{HOMEBREW_PREFIX}/bin/tview 2>/dev/null || true
        xattr -d com.apple.provenance #{HOMEBREW_PREFIX}/bin/tview 2>/dev/null || true

scoops:
  - name: tview
    repository:
      owner: devlopersabbir
      name: tview-cli
      token: "{{ .Env.PACKAGE_MANAGER_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/devlopersabbir/tview-cli
    description: Terminal candlestick chart viewer powered by Bybit market data.
    license: MIT

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: devlopersabbir
    name: tview-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
  header: |
    ## Release {{ .Tag }}

    ### 🚀 What's Changed
  footer: |
    ---
    Built by **Sabbir Hossain Shuvo** · [github.com/devlopersabbir](https://github.com/devlopersabbir)
