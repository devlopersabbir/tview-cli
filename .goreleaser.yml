project_name: tview

before:
  hooks:
    - go mod tidy

builds:
  - id: tview
    main: ./cmd/tview
    binary: tview
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tview
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: devlopersabbir
    name: tview-cli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ---
    **Full Changelog**: https://github.com/devlopersabbir/tview-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

    > Built by **Sabbir Hossain Shuvo** — [github.com/devlopersabbir](https://github.com/devlopersabbir)
